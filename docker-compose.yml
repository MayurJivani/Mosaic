# mosaic.futile.studio — one relay, one reverse proxy.
#
# The relay serves the mod board, the OBS overlay and the WebSocket from a
# single origin, so there is no second service and no cross-origin cookie.
services:
  mosaic:
    build: .
    restart: unless-stopped
    environment:
      PORT: "4322"
      MOSAIC_MAX_UPLOAD_BYTES: "536870912" # 512 MB, matches the Caddyfile
    volumes:
      # Without this a redeploy erases every mod's clip library.
      - mosaic-uploads:/app/uploads
    expose:
      - "4322"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data     # certificates — losing this re-issues on every deploy
      - caddy-config:/config
    depends_on:
      - mosaic

volumes:
  mosaic-uploads:
  caddy-data:
  caddy-config:
