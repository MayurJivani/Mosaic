name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The relay suite spawns the real server on an ephemeral port and drives
      # it over real WebSockets — a stubbed transport would not prove the room
      # protocol, the access rules or the upload paths.
      - name: Test
        run: npm test
