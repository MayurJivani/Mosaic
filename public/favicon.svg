<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
    <!-- Four tiles on the board, one just dropped. Two shapes and one accent is
         all that survives 16px, which is the size this is actually read at. -->
    <rect width="128" height="128" rx="28" fill="#0D0F14" />
    <g fill="#c8f04a">
        <rect x="24" y="24" width="34" height="34" rx="6" />
        <!-- The floor is 0.46, not lower: on the near-black tile a dimmer
             square disappears at 16px and the mark reads as three, not four. -->
        <rect x="70" y="24" width="34" height="34" rx="6" opacity="0.62" />
        <rect x="24" y="70" width="34" height="34" rx="6" opacity="0.78" />
        <rect x="70" y="70" width="34" height="34" rx="6" opacity="0.46" />
    </g>
</svg>
